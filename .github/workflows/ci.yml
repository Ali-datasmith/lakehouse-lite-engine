name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Ruff check + format check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Mypy strict
        run: uv run mypy --strict src tests

  unit-and-contract-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Pytest (unit + contract + integration, coverage gate)
        run: uv run pytest -m "not memory and not bench" --cov-report=xml
      - name: Benchmark smoke (G-BENCH)
        run: uv run python -m lakehouse_engine.benchmarks --rows 100000 --runs 2 --out ./bench-out

  legacy-and-jvm:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: G-LEGACY banned construct scan
        run: uv run pytest tests/test_no_legacy.py --no-cov -q
      - name: G-NOJVM lockfile scan
        run: |
          if grep -Ei 'name = "(pyspark|py4j|jpype1|jnius)"' uv.lock; then
            echo "::error::JVM bridge package detected in uv.lock"
            exit 1
          fi
          echo "G-NOJVM passed: no JVM bridge packages in uv.lock"

  sast:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Bandit SAST (G-SAST)
        run: uv run bandit -r src -ll --skip B108,B311
      - name: pip-audit (advisory, non-blocking)
        continue-on-error: true
        run: uv run pip-audit
