name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff check & format check
        run: uv run ruff check --extend-ignore PLR0913,PLR0915 src tests

      - name: Run Mypy strict check
        run: uv run mypy src/lakehouse_engine

  unit-and-contract-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run pytest with coverage
        run: uv run pytest --cov=lakehouse_engine --cov-report=xml

      - name: Run benchmark smoke
        run: uv run python -m lakehouse_engine.benchmarks --rows 100000 --runs 2 --out ./bench-out
