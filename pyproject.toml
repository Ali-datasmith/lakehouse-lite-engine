[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-lite-engine"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyarrow>=18.0",
  "pyiceberg[sql-sqlite,pyarrow]>=0.11",
  "polars>=1.21",
  "duckdb>=1.1",
  "psutil>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "mypy>=1.13",
  "pyarrow-stubs",
  "types-psutil",
  "ruff>=0.8",
  "pip-audit",
  "bandit>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_engine"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","N","S","C4","SIM","PTH","RUF","PERF","TC","ANN","ARG","T20","BLE","PLR","TRY","A"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101","ANN","PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=lakehouse_engine --cov-branch"
filterwarnings = ["error"]
markers = [
  "memory: RSS-gated tests",
  "contract: third-party API contract tests",
  "bench: benchmark smoke",
]
